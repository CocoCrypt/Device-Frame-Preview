name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in extension.js lib/*.js media/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Package
        run: npx --yes @vscode/vsce package -o ayzann-device-frame-preview.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ayzann-device-frame-preview.vsix
